<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pab Kviz - Trening</title>
<meta name="description" content="Trening za pab kviz: Najduža riječ i Abakus.">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pab Kviz">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{--bg:#0b1020;--bg2:#161a3a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--txt:#eef0ff;--mut:#9aa3c7;
--acc:#7c5cff;--acc2:#5b8cff;--gold:#fcd34d;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--tile:#ffffff;--tileTxt:#1e1b4b;
--safeT:env(safe-area-inset-top);--safeB:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:radial-gradient(1200px 600px at 20% -10%,#2a2470 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#1d3a7a 0%,transparent 55%),var(--bg);
-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* top bar: always visible */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safeT)) 14px 10px;background:rgba(11,16,32,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
.title{font-weight:800;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px}
.pill{padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.timer.low{color:#fff;background:#b91c1c;border-color:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.pts b{color:var(--gold)}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.bar>div{height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--acc2));transition:width .3s linear}
.hide{display:none!important}
main{flex:1;padding:14px 14px 18px}
/* bottom bar: always visible */
.bottom{position:sticky;bottom:0;z-index:20;padding:10px 12px calc(10px + var(--safeB));background:rgba(11,16,32,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.btnrow{display:flex;gap:8px}
.btn{flex:1;min-height:52px;border-radius:16px;font-weight:800;font-size:17px;background:var(--card);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn.sq{flex:0 0 56px}
.btn.op{min-height:46px;font-size:22px;border-radius:14px}
.oprow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.typer{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);margin-bottom:8px;text-transform:uppercase;letter-spacing:2px;-webkit-user-select:text;user-select:text;outline:none}
.typer:focus{border-color:var(--acc)}
.typer.bad{border-color:var(--bad)}
/* home */
.hero{text-align:center;padding:26px 6px 8px}
.hero img{width:84px;height:84px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.hero h1{margin:14px 0 4px;font-size:28px;letter-spacing:.3px}
.hero p{margin:0;color:var(--mut)}
.gamecard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;margin-top:14px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.gamecard:active{transform:scale(.98)}
.gamecard .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:900;flex:0 0 56px}
.gamecard .ic.w{background:#fff;color:var(--tileTxt)}.gamecard .ic.a{background:var(--gold);color:var(--tileTxt)}
.gamecard h3{margin:0 0 4px;font-size:19px}.gamecard p{margin:0;color:var(--mut);font-size:14px}
.gamecard .go{margin-left:auto;font-size:22px;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
/* stacked task cards */
.task{padding:12px 10px 12px;margin-bottom:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,background .15s}
.task.on{border-color:var(--acc);background:rgba(124,92,255,.10);box-shadow:0 0 0 1px rgba(124,92,255,.35)}
.task.done{border-color:rgba(52,211,153,.45)}
.task.done.on{border-color:var(--acc)}
.thead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.tname{font-weight:800;font-size:15px;color:var(--mut)}
.task.on .tname{color:var(--txt)}
.tok{color:var(--ok);font-weight:900}
.tgt{font-weight:900;font-size:22px;letter-spacing:2px;color:#1e1b4b;background:linear-gradient(135deg,#fde68a,#fbbf24);padding:4px 14px;border-radius:12px;box-shadow:0 4px 14px rgba(251,191,36,.25);font-variant-numeric:tabular-nums}
/* one row of 13 letters / 6 numbers at phone width */
.row13{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.row6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tile{aspect-ratio:1/1.25;border-radius:8px;background:var(--tile);color:var(--tileTxt);font-weight:900;font-size:clamp(13px,4.3vw,24px);box-shadow:0 3px 0 #b8bce6;padding:0;line-height:1;transition:transform .06s}
.tile.dg{font-size:clamp(9px,2.9vw,17px)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #b8bce6}
.tile.used{background:rgba(255,255,255,.10);color:rgba(255,255,255,.28);box-shadow:none}
.tile.num{aspect-ratio:auto;padding:12px 0;font-size:clamp(17px,5.2vw,26px);border-radius:12px}
.tile.num.mid{background:#bae6fd;box-shadow:0 3px 0 #7dd3fc}
.tile.num.big{background:var(--gold);box-shadow:0 3px 0 #d4a72c}
.tile.num.mid.used,.tile.num.big.used{background:rgba(255,255,255,.10);color:rgba(255,255,255,.28);box-shadow:none}
.ops{margin-top:7px}
.op{min-height:40px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:20px;font-weight:800}
.op:active{transform:scale(.95)}
.entry{margin-top:8px;padding:6px;border-radius:12px;background:rgba(0,0,0,.28);border:1px dashed var(--line)}
.entry .slot{aspect-ratio:1/1.25;border-radius:7px;background:rgba(255,255,255,.04)}
.chip{aspect-ratio:1/1.25;border-radius:7px;background:var(--acc);font-weight:900;font-size:clamp(12px,4vw,22px);display:grid;place-items:center;line-height:1}
.chip.dg{font-size:clamp(8px,2.7vw,15px)}
.chip.bad{background:var(--bad)}
.entry.expr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:8px 10px}
.entry .ex{font-size:20px;font-weight:800;letter-spacing:.5px;word-break:break-all}
.entry .val{font-size:16px;color:var(--ok);font-weight:800}
.entry .ph{color:var(--mut);font-size:13px}
.msg{margin-top:6px;text-align:center;font-size:13px;color:var(--bad)}
.saved{margin-top:6px;text-align:center;color:var(--ok);font-size:14px}
.btn.end{flex:0 0 auto;padding:0 12px;font-size:15px;color:#fecaca;border-color:rgba(248,113,113,.4)}
.btnrow .btn{min-height:50px}
.btnrow .btn.sq{flex:0 0 46px}
/* results */
.total{text-align:center;padding:10px 0 4px}.total b{font-size:56px;color:var(--gold);display:block;line-height:1}.total span{color:var(--mut)}
.res{margin-top:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.res h4{margin:0 0 8px;display:flex;justify-content:space-between;font-size:15px;color:var(--mut)}
.res h4 b{color:var(--txt)}
.res .line{margin:4px 0;font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.words span{padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.07);font-size:13px}
.words span.best{background:rgba(252,211,77,.18);color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safeB));transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;z-index:50;background:#1f2547;border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--bad);color:#fecaca}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <button class="iconbtn hide" id="backBtn" aria-label="Nazad">←</button>
      <div class="title" id="title">Pab Kviz</div>
      <span class="pill timer hide" id="timer">5:00</span>
      <span class="pill pts hide" id="ptsPill">★ <b id="pts">0</b></span>
    </div>
    <div class="bar hide" id="barWrap"><div id="bar"></div></div>
  </header>
  <main id="main"><div class="loading">Učitavanje…</div></main>
  <footer class="bottom hide" id="bottom"></footer>
</div>
<div class="toast" id="toast"></div>
<script src="/data.js" defer></script>
<script src="/abakus-core.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
